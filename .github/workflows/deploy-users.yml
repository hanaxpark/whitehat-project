name: deploy-users

on:
  push:
    branches: [main]
    paths: ["users-service/**", ".github/workflows/deploy.yml", ".github/workflows/deploy-users.yml"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      service: users
      role-arn: ${{ vars.USERS_DEPLOY_ROLE_ARN }}
