name: deploy-contents

on:
  push:
    branches: [main]
    paths: ["contents-service/**", ".github/workflows/deploy.yml", ".github/workflows/deploy-contents.yml"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      service: contents
      role-arn: ${{ vars.CONTENTS_DEPLOY_ROLE_ARN }}
