              expand_more

<!-- 3. 내용 및 서식 툴바 (Content & Formatting Toolbar) -->

</button>

<script>
  // Simple Editor helpers
  function applyFormat(type) {
    const textarea = document.getElementById('editor-content');
    if (!textarea) return;
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    const selected = textarea.value.substring(start, end);
    let replacement = '';

    switch (type) {
      case 'bold':
        replacement = `**${selected || '굵은 텍스트'}**`;
        break;
      case 'italic':
        replacement = `*${selected || '기울임 텍스트'}*`;
        break;
      case 'strike':
        replacement = `~~${selected || '취소선 텍스트'}~~`;
        break;
      case 'bullet-list':
        replacement = `\n- ${selected || '목록 항목'}`;
        break;
      case 'numbered-list':
        replacement = `\n1. ${selected || '목록 항목'}`;
        break;
      case 'link':
        replacement = `[${selected || '링크 제목'}](https://example.com)`;
        break;
      case 'code-block':
        replacement = `\n\`\`\`javascript\n${selected || '// 코드 작성'}\n\`\`\`\n`;
        break;
    }

    textarea.setRangeText(replacement, start, end, 'end');
    textarea.focus();
  }

  // Drag and Drop & Upload Preview
  const dropZone = document.getElementById('drop-zone');
  const previewList = document.getElementById('preview-list');
  const uploadStatus = document.getElementById('upload-status');

  if (dropZone) {
    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.add('bg-surface-container-high');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.remove('bg-surface-container-high');
      }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const files = dt.files;
      handleFilesSelected(files);
    }, false);
  }

  function handleFilesSelected(files) {
    if (!files || files.length === 0) return;
    previewList.classList.remove('hidden');
    previewList.classList.add('grid');

    Array.from(files).forEach(file => {
      if (!file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const item = document.createElement('div');
        item.className = 'relative group rounded-lg overflow-hidden bg-surface-container aspect-video shadow-sm';
        item.innerHTML = `
          <img src="${e.target.result}" alt="${file.name}" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-on-surface/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
            <button type="button" class="p-1 rounded-full bg-error text-on-error hover:scale-110 transition-transform" onclick="this.closest('.relative').remove()">
              <span class="material-symbols-outlined text-[16px] block">close</span>
            </button>
          </div>
          <span class="absolute bottom-1 left-1.5 right-1.5 text-[10px] text-white bg-on-surface/60 px-1 py-0.5 rounded truncate">${file.name}</span>
        `;
        previewList.appendChild(item);
      };
      reader.readAsDataURL(file);
    });

    if (uploadStatus) {
      uploadStatus.textContent = `${previewList.children.length + files.length}개 파일 첨부됨`;
    }
  }

  // Submit Feedback Mock
  const form = document.getElementById('post-create-form');
  if (form) {
    form.addEventListener('submit', function() {
      const title = document.getElementById('post-title').value;
      const category = document.getElementById('post-category').value;
      if (!title || !category) return;
      
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span>
        <span>등록 중...</span>
      `;

      setTimeout(() => {
        alert('게시글이 성공적으로 등록되었습니다.');
        window.location.href = '#';
      }, 700);
    });
  }
</script></main><footer class="w-full bg-[#0F172A] text-slate-400 py-10 mt-auto"><div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-4 font-body-sm text-body-sm"><div><img src="https://lh3.googleusercontent.com/aida-public/AB6AXuBUJqEP-IuKyqbGQIxoQim2DMpSREnCC-UygIb5bG3DMsYqFXOxm6RTmbc1O932tkblyvkoQ6SmUpKTxEZQZ8HEqVc79hIRd3inRDESmS2vfO_nQHg_3XzPTX4x7n-Sq0gQcz3By-nL1cn4XZ4qTZ4ZdOQ7x970KmcE2akZJYZHJRM8YQdi68jMKhY0rhMSooL4-d2B1YOfPrzXlohfKhPj4U6rqV3pcoPsaD3YYvsNSPSgaZsn-KGjeHhISB6GwTtIfA" alt="난기류" class="h-7 w-auto object-contain"><span class="ml-3 text-slate-500">개발자를 위한 지식 공유 및 성장 커뮤니티</span></div><div class="flex items-center gap-6 text-slate-400"><a class="hover:text-white transition-colors" href="#">이용약관</a><a class="hover:text-white transition-colors" href="#">개인정보처리방침</a><a class="hover:text-white transition-colors" href="#">고객지원</a></div></div></footer>
