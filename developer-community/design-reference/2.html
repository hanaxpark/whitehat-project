        </button>
</div>
<!-- Header Copy -->
<div class="text-center mb-6">
<h1 class="font-headline-lg text-headline-lg font-bold text-on-surface tracking-tight mb-2" id="auth-title">난기류에 오신 것을 환영합니다!</h1>

<!-- Login Form View -->

<div class="hidden flex-col gap-1.5" id="register-name-field">

          </label>
<div class="relative flex items-center">

</div>

<input class="w-full h-11 px-3.5 bg-surface-container-low rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest focus:shadow-md transition-all" id="user-email" placeholder="이메일을 입력하세요" required="" type="email">

              비밀번호
            </label>
<a class="font-label-sm text-label-sm text-primary-container hover:underline" href="#" id="forgot-password-link">
              비밀번호 찾기
            </a>
</div>
<div class="relative flex items-center">
<input class="w-full h-11 px-3.5 pr-10 bg-surface-container-low rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest focus:shadow-md transition-all" id="user-password" placeholder="비밀번호를 입력하세요" required="" type="password">
<button class="absolute right-3 text-secondary hover:text-on-surface focus:outline-none" onclick="togglePasswordVisibility('user-password', 'pwd-toggle-icon')" type="button">
<span class="material-symbols-outlined text-[18px]" id="pwd-toggle-icon">visibility</span>
</button>
</div>
</div>
<!-- Registration-only Confirm Password -->
<div class="hidden flex-col gap-1.5" id="register-confirm-field">
<label class="flex items-center gap-1.5 font-label-md text-label-md text-on-surface font-medium" for="user-password-confirm">
<span class="material-symbols-outlined text-secondary text-[18px]">lock_reset</span>

          </label>

<script>
  let currentAuthMode = 'login';

  function switchAuthTab(mode) {
    currentAuthMode = mode;
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const authTitle = document.getElementById('auth-title');
    const authSubtitle = document.getElementById('auth-subtitle');
    const registerNameField = document.getElementById('register-name-field');
    const registerConfirmField = document.getElementById('register-confirm-field');
    const forgotPwd = document.getElementById('forgot-password-link');
    const rememberMeLabel = document.getElementById('remember-me-label');
    const submitBtnIcon = document.getElementById('submit-btn-icon');
    const submitBtnText = document.getElementById('submit-btn-text');
    const switchPrompt = document.getElementById('switch-prompt');
    const switchLink = document.getElementById('switch-link');

    if (mode === 'login') {
      // Button states
      tabLogin.className = 'relative py-2.5 text-center font-headline-sm text-headline-sm font-semibold rounded-md transition-all duration-200 text-on-primary bg-primary-container shadow-sm flex items-center justify-center gap-1.5';
      tabRegister.className = 'relative py-2.5 text-center font-headline-sm text-headline-sm font-medium rounded-md transition-all duration-200 text-secondary hover:text-on-surface flex items-center justify-center gap-1.5';

      // Title & subtext
      authTitle.textContent = 'DevTalk에 오신 것을 환영합니다!';
      authSubtitle.textContent = '계정에 로그인하고 개발자들과 함께하세요.';

      // Hidden fields
      registerNameField.classList.add('hidden');
      registerNameField.classList.remove('flex');
      registerConfirmField.classList.add('hidden');
      registerConfirmField.classList.remove('flex');

      // Labels & controls
      forgotPwd.classList.remove('hidden');
      rememberMeLabel.textContent = '로그인 상태 유지';
      submitBtnIcon.textContent = 'login';
      submitBtnText.textContent = '로그인';
      switchPrompt.textContent = '계정이 없으신가요?';
      switchLink.textContent = '회원가입';
    } else {
      // Register active
      tabRegister.className = 'relative py-2.5 text-center font-headline-sm text-headline-sm font-semibold rounded-md transition-all duration-200 text-on-primary bg-primary-container shadow-sm flex items-center justify-center gap-1.5';
      tabLogin.className = 'relative py-2.5 text-center font-headline-sm text-headline-sm font-medium rounded-md transition-all duration-200 text-secondary hover:text-on-surface flex items-center justify-center gap-1.5';

      // Title & subtext
      authTitle.textContent = 'DevTalk의 새로운 멤버가 되어보세요!';
      authSubtitle.textContent = '지식을 공유하고 함께 성장하는 커뮤니티입니다.';

      // Show extra fields
      registerNameField.classList.remove('hidden');
      registerNameField.classList.add('flex');
      registerConfirmField.classList.remove('hidden');
      registerConfirmField.classList.add('flex');

      // Labels & controls
      forgotPwd.classList.add('hidden');
      rememberMeLabel.textContent = '서비스 이용약관 및 개인정보 정책에 동의합니다.';
      submitBtnIcon.textContent = 'person_add';
      submitBtnText.textContent = '회원가입 완료';
      switchPrompt.textContent = '이미 계정이 있으신가요?';
      switchLink.textContent = '로그인';
    }
  }

  function toggleCurrentView() {
    switchAuthTab(currentAuthMode === 'login' ? 'register' : 'login');
  }

  function togglePasswordVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (!input || !icon) return;
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }
</script></main>
