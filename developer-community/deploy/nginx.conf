# /etc/nginx/conf.d/community.conf
# ALB의 기본 Target Group → 이 EC2의 80번 포트.
# API는 ALB가 ECS로 직접 분기하므로 Nginx에서 프록시하지 않습니다.
server {
    listen 80;
    server_name _;
    root /var/www/nangiryu/dist;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # 잘못 라우팅된 API가 index.html (200)로 응답되지 않게 방어합니다.
    location = /api { return 404; }
    location ^~ /api/ {
        default_type application/json;
        return 404 '{"error":{"code":"MISROUTED_API","message":"Check ALB listener rules"}}';
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control 'public, max-age=31536000, immutable';
        add_header X-Content-Type-Options nosniff always;
    }
    location = /index.html {
        add_header Cache-Control 'no-cache';
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
